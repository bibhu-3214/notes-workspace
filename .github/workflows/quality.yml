name: Product checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: python -m venv api/.venv
      - run: api/.venv/bin/python -m pip install -r api/requirements-dev.txt
      - run: api/.venv/bin/python -m ruff check api
      - run: api/.venv/bin/python -m ruff format --check api
      - run: yarn check
      - run: yarn test
      - run: yarn test:api
      - run: yarn test:runner
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-browser-evidence
          path: output/
          retention-days: 7
